# T-206 — 공개 레포 보안 방어선 (pre-commit 게이트)
#
# 이 파일은 로컬 커밋 직전 staged 변경사항만 검사한다.
# CI(.github/workflows/ci.yml)의 gitleaks detect 는 전체 트리를 스캔하며,
# 이 두 검사는 한 쌍이다: pre-commit 이 1차 방어선(커밋 차단)이고,
# CI 가 2차 방어선(이미 들어온 커밋이라도 PR 단계에서 차단)이다.
# 둘 중 하나라도 빠지면 보안 구멍이 생기므로 항상 같이 유지한다.

repos:
  # gitleaks — 평문 API 키/시크릿 커밋 차단.
  # staged 파일만 검사하므로 빠르지만, 이미 커밋된 과거 이력은 못 본다
  # (과거 이력은 CI 의 전체 트리 스캔 + gitleaks history 스캔 담당).
  # 커스텀 룰셋(.gitleaks.toml) 은 네이버 커머스/검색광고 키 패턴을 잡는다.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        # --staged 는 gitleaks pre-commit hook 이 기본으로 켜는 모드.
        # 명시해두어 사용자가 로컬에서 실행할 때와 동작이 같게 한다.
        args: [--config, .gitleaks.toml]

  # pre-commit 기본 훅 — 자주 실수하는 위험을 막는 최소한의 셋.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # SSH/RSA/PEM 개인키가 스냅될 가능성을 0으로.
      # config.example.json 의 placeholder 는 키 형태가 아니므로 잡지 않는다.
      - id: detect-private-key
      # 5MB(5120KB) 초과 파일 — 보통 상세페이지 원본 이미지나 로그.
      # 대용량 바이너리는 저장소를 부풀리고 LFS 를 강제한다.
      - id: check-added-large-files
        args: [--maxkb, "5120"]
      # 머지 충돌 마커(<<<<<<<) 가 커밋되는 것을 막는다.
      - id: check-merge-conflict
      # 파일 끝 개행 보정 — POSIX 규약 + diff 노이즈 감소.
      - id: end-of-file-fixer
      # 후행 공백 제거. --markdown-linebreak-ext=md 는 마크다운의
      # 의도된 줄바꿈(줄 끝 공백 2개)을 보호하기 위해 필수다.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  # ruff — pyproject.toml 의 [tool.ruff] 설정을 공유.
  # pre-commit 단계에서 check + format 을 모두 돌려 커밋 시점에 정렬.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
