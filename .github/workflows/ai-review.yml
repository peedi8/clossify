# AI 보조 리뷰 — PR 에 인라인 코멘트를 단다.
#
# 설계 원칙 (이걸 바꾸기 전에 반드시 읽을 것):
#   1. AI 리뷰는 **보조 리뷰어**다. 하드 게이트는 ci.yml 의 결정론 도구(ruff/pytest/gitleaks)가 유지한다.
#      이 잡을 required status check 로 지정하지 마라 — 스킵 조건(fork PR·키 미등록)에서 체크가
#      아예 생성되지 않으면 모든 PR 이 영구 대기에 걸린다.
#   2. 실패해도 빨간 X 를 만들지 않는다(continue-on-error). 매 PR 에 붙는 빨간 X 는
#      체크 전체를 무시하게 만든다. 대신 경고 + 요약으로 **가시화**한다(무음 열화 금지).
#   3. fork PR 은 잡 자체를 건너뛴다. pull_request_target 을 쓰지 않는다 —
#      외부 코드를 시크릿 접근 컨텍스트에서 실행하면 키 탈취 경로가 된다.
#
# 켜기 전 필요한 것 (셋 다 있어야 동작한다. 하나라도 없으면 조용히 건너뛴다):
#   - Claude GitHub App 을 이 저장소에 설치
#   - 저장소 시크릿 CLOSSIFY_GIT  (구독 인증 토큰. 로컬에서 `claude setup-token` 으로 발급한다.
#     API 크레딧을 사지 않고 구독의 주간 한도를 쓴다 — 대신 대화형 작업과 같은 예산을 나눠 쓴다.
#     시크릿은 write 권한자가 꺼낼 수 있으므로, 유출 시 그 토큰만 폐기하면 되게 격리한다)
#   - 아래 permissions (특히 id-token: write — 없으면 시작조차 못 한다)

name: AI 보조 리뷰

# ⚠️ 이 리뷰는 **자동으로 돌지 않는다. 부를 때만 돈다.**
# 인증이 구독 토큰이라 예산이 돈이 아니라 **주간 한도**다 — 리뷰가 도는 만큼 대화형 작업 몫이 줄어든다.
# 실측: 정상 완주 1회 = **27턴**(2026-08-11 run 31459256950). 싼 값이 아니다.
# 그래서 PR 이 열릴 때조차 자동으로 돌리지 않는다. 보고 싶은 PR 에만
# **`ai-review` 라벨을 붙인다**(뗐다 다시 붙이면 또 돈다).
# 자동으로 되돌리려면 아래 types 에 `opened` 를 넣으면 된다.
on:
  pull_request:
    types: [labeled]
    # 문서·설정만 바뀐 PR 은 리뷰할 코드가 없다. 한도를 쓰지 않는다.
    # (이 잡은 required check 가 아니므로 아예 안 돌아도 PR 이 막히지 않는다)
    paths-ignore:
      - "**/*.md"
      - ".github/**"
      - "docs/**"
      - "LICENSE*"

# 같은 PR 에 리뷰가 겹치면 앞엣것을 취소한다(한도 중복 소모 방지).
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write          # OIDC 발급에 필수

jobs:
  review:
    # 초안 PR 제외. fork PR 제외(시크릿 노출 차단).
    # `ai-review` 라벨일 때만 — 아무 라벨에나 리뷰가 돌면 한도가 샌다.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.label.name == 'ai-review'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # diff 밖 파일까지 읽어 교차 정합성을 보게 한다

      - name: 키 등록 여부 확인
        id: guard
        env:
          KEY: ${{ secrets.CLOSSIFY_GIT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOSSIFY_GIT 시크릿이 없어 AI 리뷰를 건너뜁니다."
            {
              echo "### AI 보조 리뷰 건너뜀"
              echo "저장소 시크릿 \`CLOSSIFY_GIT\` 가 없습니다."
              echo "값은 \`claude setup-token\` 으로 발급한 **구독 인증 토큰**입니다(API 키 아님)."
              echo "결정론 검사(ruff·pytest·gitleaks)는 그대로 동작합니다."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # 같은 커밋을 두 번 리뷰하지 않는다.
      # 라벨을 뗐다 다시 붙이거나, 리뷰 후 코드 없이 라벨만 만지면 **똑같은 내용**을
      # 다시 읽게 된다. 한 번에 27턴이 드는데 새로 나올 지적이 없다 — 그냥 낭비다.
      # 커밋이 하나라도 새로 올라오면 SHA 가 바뀌므로 그때는 정상적으로 돈다.
      - name: 이 커밋을 이미 리뷰했나
        if: steps.guard.outputs.ready == 'true'
        id: dedupe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          n="$(gh api "repos/$REPO/pulls/$PR/comments" --paginate \
                --jq "[.[] | select(.commit_id == \"$HEAD_SHA\")] | length" \
               | awk '{s+=$1} END {print s+0}')"
          if [ "${n:-0}" -gt 0 ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "::warning::이 커밋(${HEAD_SHA:0:7})은 이미 리뷰했습니다 — 한도를 쓰지 않고 건너뜁니다."
            {
              echo "### AI 보조 리뷰 건너뜀 — 이미 본 커밋"
              echo "커밋 \`${HEAD_SHA:0:7}\` 에 이미 리뷰 코멘트 **${n}건**이 달려 있습니다."
              echo "같은 내용을 다시 읽어봐야 새로 나올 지적이 없으므로 돌리지 않았습니다."
              echo "새 커밋을 올린 뒤 라벨을 다시 붙이면 그때 동작합니다."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 리뷰 지침 읽기
        if: steps.guard.outputs.ready == 'true' && steps.dedupe.outputs.done != 'true'
        id: guide
        run: |
          {
            echo 'text<<REVIEW_GUIDE_EOF'
            cat .github/REVIEW_GUIDE.md
            echo 'REVIEW_GUIDE_EOF'
          } >> "$GITHUB_OUTPUT"

      # 게시 전 게시물 수를 센다. 아래 '결과 요약' 이 이 값과 비교해
      # **실제로 리뷰가 붙었는지**를 판정한다 — 액션의 outcome 은 믿을 수 없다.
      # (액션은 스스로 건너뛴 경우에도 outcome=success 로 끝난다)
      - name: 게시물 수 세기 (전)
        if: steps.guard.outputs.ready == 'true' && steps.dedupe.outputs.done != 'true'
        id: before
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          count_all() {
            {
              gh api "repos/$REPO/pulls/$PR/comments" --paginate --jq 'length'
              gh api "repos/$REPO/issues/$PR/comments" --paginate --jq 'length'
              gh api "repos/$REPO/pulls/$PR/reviews"   --paginate --jq 'length'
            } | awk '{s+=$1} END {print s+0}'
          }
          echo "count=$(count_all)" >> "$GITHUB_OUTPUT"

      - name: AI 리뷰 실행
        if: steps.guard.outputs.ready == 'true' && steps.dedupe.outputs.done != 'true'
        id: ai
        continue-on-error: true          # 실패해도 PR 을 막지 않는다
        uses: anthropics/claude-code-action@v1
        with:
          # 구독 인증을 쓴다(API 크레딧 아님). 토큰은 `claude setup-token` 으로 발급한다.
          # 사용량은 구독의 주간 한도에서 나가므로, 리뷰가 대화형 작업과 같은 예산을 쓴다.
          # API 키로 되돌리려면 이 줄을 anthropic_api_key 로 바꾸면 된다 — 둘 다 같은 시크릿을 읽는다.
          claude_code_oauth_token: ${{ secrets.CLOSSIFY_GIT }}
          # 리뷰에는 상위 모델이 필요 없다(레퍼런스 실측). 비용 대비 효과가 가장 좋은 조합.
          claude_args: >-
            --model sonnet
            --max-turns 25
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(git:*)"
          # 턴 상한 25: 한도를 쓰는 건 턴이 아니라 토큰이지만, 상한은 **폭주를 막는 뚜껑**이다.
          # 실측 22턴짜리 실행은 그중 11턴이 권한 거부로 날아간 것이었다(그건 위에서 고쳤다).
          # 아래 프롬프트가 "절반 넘게 썼으면 그 시점 결론을 게시하라"고 지시하므로,
          # 뚜껑에 닿아도 침묵이 아니라 불완전한 리뷰가 남는다.
          # allowedTools 는 **추가** 목록이다(배타적 허용 목록이 아니다).
          # 저장소 기본 도구는 항상 포함되고, 여기 적은 것이 거기에 더해진다.
          #   - inline_comment: 게시 수단. 없으면 리뷰를 남길 방법이 없다.
          #   - Read/Grep/Glob: diff 밖 파일을 읽어야 교차 정합성 리뷰가 된다.
          #   - Bash(git:*): 이 이벤트에서는 변경 내용이 프롬프트에 자동으로 들어오지
          #     않는다. 리뷰어가 스스로 diff 를 읽어야 하는데 Bash 는 기본 포함이 아니다.
          # ★ 하위명령 4개(diff·log·show·status)로 좁혔더니 **9번 거부당하고 턴을 다 썼다**
          #   (run 31458917877: 26턴 · Bash 거부 9 · 게시 0건). 리뷰어가 쓰는 조회 명령은
          #   그 넷보다 많다. git 전체로 넓힌다 — 토큰이 contents:read 라 쓰기는 어차피 막힌다.
          #   좁히는 것 자체가 비용이었다: 막힐 때마다 턴을 쓰고, 턴을 다 쓰면 리뷰가 0건이 된다.
          # 실측 근거: 아무 Bash 도 없던 판(run 31413683298)은 22턴 · 거부 11회 · 게시 0건.
          prompt: |
            이 PR 을 아래 지침에 따라 리뷰하고, **반드시 인라인 코멘트로 게시**하라.
            게시하지 않은 리뷰는 존재하지 않는 것과 같다.

            ${{ steps.guide.outputs.text }}

            ## 진행 규칙
            - **12번째 턴을 넘겼으면 더 보지 말고 그 시점의 결론을 게시하라.** 턴 상한은 25다.
              확인하지 못한 항목은 "확인 못 함"으로 명시한다. 불완전한 리뷰가 게시 안 된 리뷰보다 낫다.
            - **도구가 거부되면 같은 것을 다시 시도하지 마라.** 다른 수단으로 우회하고,
              그래도 안 되면 그 항목을 "확인 못 함"으로 적고 **게시까지 반드시 마쳐라.**
              거부와 씨름하다 턴을 다 쓰면 아무것도 남지 않는다 — 실제로 그렇게 끝난 적이 있다.
            - 확신이 없는 지적에는 **`추정`** 라벨을 붙여라.
            - 수정 코드는 **한 파일·몇 줄·판단이 개입하지 않을 때만** 제시하고,
              `로컬에서 확인함` 또는 `미검증` 을 함께 적어라.
            - 지적이 없으면 "지적 사항 없음" 을 한 줄로 게시하라(침묵 금지).

      # 리뷰가 안 붙었을 때 원인을 **추측하지 않기 위한** 스텝.
      # 평소에는 지표만 찍는다 — 대화 본문은 길고 저장소 내용이 로그에 남는다.
      # 다만 **일찍 죽은 경우(2턴 이하)** 는 본문에 저장소 내용이 있을 수 없으므로
      # 기록 원문을 잘라서 보여준다. 조기 실패는 원인이 그 안에만 적혀 있다.
      - name: 리뷰 실행 진단
        if: always() && steps.ai.outputs.execution_file != ''
        env:
          EXEC_FILE: ${{ steps.ai.outputs.execution_file }}
        run: |
          [ -f "$EXEC_FILE" ] || { echo "실행 기록 파일 없음"; exit 0; }
          python3 - "$EXEC_FILE" <<'PY'
          import collections, json, os, sys
          path = sys.argv[1]
          raw = open(path, encoding="utf-8", errors="replace").read()
          try:
              data = json.loads(raw)
          except Exception as exc:
              print(f"실행 기록을 JSON 으로 읽지 못함: {exc}")
              print(raw[:3000])
              raise SystemExit(0)

          results, denials = [], []
          def walk(node):
              if isinstance(node, dict):
                  if node.get("type") == "result":
                      results.append(node)
                  found = node.get("permission_denials")
                  if isinstance(found, list):
                      denials.extend(found)
                  for value in node.values():
                      walk(value)
              elif isinstance(node, list):
                  for value in node:
                      walk(value)
          walk(data)

          turns = 0
          failed = False
          for r in results:
              turns = max(turns, r.get("num_turns") or 0)
              failed = failed or bool(r.get("is_error"))
              print(
                  "결과: subtype={} is_error={} turns={} cost=${}".format(
                      r.get("subtype"), r.get("is_error"),
                      r.get("num_turns"), r.get("total_cost_usd"),
                  )
              )
              # cost 는 토큰 수를 정가로 환산한 값일 뿐이다. 구독 토큰으로 돌면
              # 실제로 청구되는 돈은 없고 **주간 한도**가 깎인다. 그러니 한도를 가늠하려면
              # 환산 금액이 아니라 **토큰 수**를 봐야 한다 — 그래서 함께 찍는다.
              use = r.get("usage")
              if isinstance(use, dict):
                  print(
                      "  토큰: 입력 {} · 출력 {} · 캐시읽기 {} · 캐시생성 {}".format(
                          use.get("input_tokens"), use.get("output_tokens"),
                          use.get("cache_read_input_tokens"),
                          use.get("cache_creation_input_tokens"),
                      )
                  )

          if denials:
              counted = collections.Counter(
                  d.get("tool_name", "?") if isinstance(d, dict) else str(d)
                  for d in denials
              )
              print("거부된 도구 (이름: 횟수)")
              for name, n in counted.most_common():
                  print(f"  {name}: {n}")
              # 이름만으로는 허용 목록을 어떻게 고쳐야 할지 알 수 없다.
              # "Bash: 9" 를 보고 어떤 명령이 막혔는지 추측하게 두면 또 헛돈다.
              print("거부된 호출 (무엇을 하려다 막혔나)")
              for d in denials:
                  if not isinstance(d, dict):
                      print(f"  {str(d)[:160]}")
                      continue
                  arg = d.get("tool_input") or d.get("input") or {}
                  if isinstance(arg, dict):
                      detail = arg.get("command") or arg.get("file_path") or arg.get("pattern")
                      if detail is None:
                          detail = json.dumps(arg, ensure_ascii=False)[:160]
                  else:
                      detail = str(arg)
                  print(f"  {d.get('tool_name', '?')}: {str(detail)[:160]}")
          else:
              print("거부된 도구 없음")

          # 결제 문제는 배선 문제로 오진하기 제일 쉬운 자리다(로그상 증상이 똑같다).
          # 재실행·설정 변경으로는 절대 낫지 않으므로 제목으로 띄운다.
          if "billing_error" in raw or "Credit balance is too low" in raw:
              print("::warning::사용 한도 문제입니다 — 인증 수단의 잔액/한도가 부족합니다. "
                    "배선 문제가 아니며 재실행해도 낫지 않습니다.")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
                  fh.write("### AI 보조 리뷰 — 사용 한도\n")
                  fh.write("인증 수단의 **잔액·한도 부족**입니다(`billing_error`).\n")
                  fh.write("워크플로·시크릿 등록·권한은 정상입니다. 한도가 회복되면 그대로 동작합니다.\n")
                  fh.write("구독 토큰을 쓰는 경우 주간 한도가 찼을 수 있습니다.\n")

          # 조기 실패 = 모델이 일을 시작도 못 했다는 뜻. 원문에 저장소 내용이 없다.
          # system(init) 이벤트는 도구·명령 목록이라 길기만 하고 원인이 없다 — 빼고 찍는다.
          if failed and turns <= 2:
              events = data if isinstance(data, list) else [data]
              body = [e for e in events if not (isinstance(e, dict) and e.get("type") == "system")]
              print("--- 조기 실패: system 외 이벤트 (앞 4000자) ---")
              print(json.dumps(body, ensure_ascii=False, indent=2)[:4000])
          PY

      # ⚠️ 이 스텝의 존재 이유: 액션의 outcome 을 완료 신호로 쓰면 **거짓 완료**가 난다.
      # 액션은 스스로 건너뛴 경우(아래 '워크플로 검증')에도 outcome=success 로 끝나므로,
      # 판정은 반드시 **게시물이 실제로 늘었는지**로 한다. 이 비교를 없애지 마라.
      - name: 결과 요약
        if: always() && steps.guard.outputs.ready == 'true' && steps.dedupe.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ steps.before.outputs.count }}
          AI_OUTCOME: ${{ steps.ai.outcome }}
        run: |
          count_all() {
            {
              gh api "repos/$REPO/pulls/$PR/comments" --paginate --jq 'length'
              gh api "repos/$REPO/issues/$PR/comments" --paginate --jq 'length'
              gh api "repos/$REPO/pulls/$PR/reviews"   --paginate --jq 'length'
            } | awk '{s+=$1} END {print s+0}'
          }
          posted=$(( $(count_all) - ${BEFORE:-0} ))

          # 액션은 PR 이 워크플로 파일을 고치면 스스로 건너뛴다
          # ("workflow file must have identical content to the default branch").
          # PR 에서 워크플로를 고쳐 시크릿을 빼가는 걸 막는 장치이므로 우회하지 마라.
          # 원인을 모르면 배선 문제로 오진하게 되니 여기서 이름을 붙여준다.
          if gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' \
               | grep -q '^\.github/workflows/'; then
            wf_changed=yes
          else
            wf_changed=no
          fi

          if [ "$posted" -gt 0 ]; then
            {
              echo "### AI 보조 리뷰 완료"
              echo "게시물 **${posted}건**."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$wf_changed" = "yes" ]; then
            echo "::warning::워크플로 파일을 수정한 PR 이라 AI 리뷰가 건너뛰어졌습니다(정상 동작)."
            {
              echo "### AI 보조 리뷰 건너뜀 — 워크플로 파일 수정 PR"
              echo "이 PR 이 \`.github/workflows/\` 를 고치므로 액션이 스스로 실행을 거부했습니다."
              echo "PR 에서 워크플로를 고쳐 시크릿을 탈취하는 것을 막는 장치입니다 — **배선 문제가 아닙니다.**"
              echo "이 PR 이 머지되면 다음 PR 부터 리뷰가 정상 동작합니다."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::AI 리뷰가 한 건도 게시되지 않았습니다(결정론 검사는 정상)."
            {
              echo "### AI 보조 리뷰 미게시"
              echo "액션 결과: \`${AI_OUTCOME}\` · 게시물 증가: **0건**"
              echo "결정론 검사(ruff·pytest·gitleaks)는 그대로 동작합니다."
              echo ""
              echo "확인 순서: GitHub App 설치 → API 키 → 사용 한도 → 허용 도구 목록 → 최대 턴 수."
              echo "사용 한도 초과나 App 미설치는 **재실행해도 낫지 않는다** — 계정 쪽을 먼저 보라."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
