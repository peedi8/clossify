# AI 보조 리뷰 — PR 에 인라인 코멘트를 단다.
#
# 설계 원칙 (이걸 바꾸기 전에 반드시 읽을 것):
#   1. AI 리뷰는 **보조 리뷰어**다. 하드 게이트는 ci.yml 의 결정론 도구(ruff/pytest/gitleaks)가 유지한다.
#      이 잡을 required status check 로 지정하지 마라 — 스킵 조건(fork PR·키 미등록)에서 체크가
#      아예 생성되지 않으면 모든 PR 이 영구 대기에 걸린다.
#   2. 실패해도 빨간 X 를 만들지 않는다(continue-on-error). 매 PR 에 붙는 빨간 X 는
#      체크 전체를 무시하게 만든다. 대신 경고 + 요약으로 **가시화**한다(무음 열화 금지).
#   3. fork PR 은 잡 자체를 건너뛴다. pull_request_target 을 쓰지 않는다 —
#      외부 코드를 시크릿 접근 컨텍스트에서 실행하면 키 탈취 경로가 된다.
#
# 켜기 전 필요한 것 (셋 다 있어야 동작한다. 하나라도 없으면 조용히 건너뛴다):
#   - Claude GitHub App 을 이 저장소에 설치
#   - 저장소 시크릿 CLOSSIFY_GIT  (Anthropic API 키. 리뷰 전용으로 새로 발급한 것 —
#     시크릿은 write 권한자가 꺼낼 수 있으므로, 유출 시 그 키만 폐기하면 되게 격리한다)
#   - 아래 permissions (특히 id-token: write — 없으면 시작조차 못 한다)

name: AI 보조 리뷰

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# 같은 PR 에 새 커밋이 오면 진행 중인 리뷰를 취소한다(중복 과금 방지).
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write          # OIDC 발급에 필수

jobs:
  review:
    # 초안 PR 제외. fork PR 제외(시크릿 노출 차단).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # diff 밖 파일까지 읽어 교차 정합성을 보게 한다

      - name: 키 등록 여부 확인
        id: guard
        env:
          KEY: ${{ secrets.CLOSSIFY_GIT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOSSIFY_GIT 시크릿이 없어 AI 리뷰를 건너뜁니다."
            {
              echo "### AI 보조 리뷰 건너뜀"
              echo "저장소 시크릿 \`CLOSSIFY_GIT\` (Anthropic API 키) 가 없습니다."
              echo "결정론 검사(ruff·pytest·gitleaks)는 그대로 동작합니다."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 리뷰 지침 읽기
        if: steps.guard.outputs.ready == 'true'
        id: guide
        run: |
          {
            echo 'text<<REVIEW_GUIDE_EOF'
            cat .github/REVIEW_GUIDE.md
            echo 'REVIEW_GUIDE_EOF'
          } >> "$GITHUB_OUTPUT"

      # 게시 전 게시물 수를 센다. 아래 '결과 요약' 이 이 값과 비교해
      # **실제로 리뷰가 붙었는지**를 판정한다 — 액션의 outcome 은 믿을 수 없다.
      # (액션은 스스로 건너뛴 경우에도 outcome=success 로 끝난다)
      - name: 게시물 수 세기 (전)
        if: steps.guard.outputs.ready == 'true'
        id: before
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          count_all() {
            {
              gh api "repos/$REPO/pulls/$PR/comments" --paginate --jq 'length'
              gh api "repos/$REPO/issues/$PR/comments" --paginate --jq 'length'
              gh api "repos/$REPO/pulls/$PR/reviews"   --paginate --jq 'length'
            } | awk '{s+=$1} END {print s+0}'
          }
          echo "count=$(count_all)" >> "$GITHUB_OUTPUT"

      - name: AI 리뷰 실행
        if: steps.guard.outputs.ready == 'true'
        id: ai
        continue-on-error: true          # 실패해도 PR 을 막지 않는다
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CLOSSIFY_GIT }}
          # 리뷰에는 상위 모델이 필요 없다(레퍼런스 실측). 비용 대비 효과가 가장 좋은 조합.
          claude_args: >-
            --model sonnet
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob"
          # allowedTools 주의: 배타적 허용 목록이다.
          #   - inline_comment 가 있어야 액션이 게시용 MCP 서버를 설치한다(없으면 게시 수단 자체가 없음)
          #   - Read/Grep/Glob 이 있어야 diff 밖 파일을 읽는 교차 정합성 리뷰가 된다
          #     (없으면 권한 거부로 몇 초 만에 포기한다)
          prompt: |
            이 PR 을 아래 지침에 따라 리뷰하고, **반드시 인라인 코멘트로 게시**하라.
            게시하지 않은 리뷰는 존재하지 않는 것과 같다.

            ${{ steps.guide.outputs.text }}

            ## 진행 규칙
            - 탐색에 턴을 절반 넘게 썼다면 **그 시점의 결론을 게시**하라.
              확인하지 못한 항목은 "확인 못 함"으로 명시한다. 불완전한 리뷰가 게시 안 된 리뷰보다 낫다.
            - 확신이 없는 지적에는 **`추정`** 라벨을 붙여라.
            - 수정 코드는 **한 파일·몇 줄·판단이 개입하지 않을 때만** 제시하고,
              `로컬에서 확인함` 또는 `미검증` 을 함께 적어라.
            - 지적이 없으면 "지적 사항 없음" 을 한 줄로 게시하라(침묵 금지).

      # ⚠️ 이 스텝의 존재 이유: 액션의 outcome 을 완료 신호로 쓰면 **거짓 완료**가 난다.
      # 액션은 스스로 건너뛴 경우(아래 '워크플로 검증')에도 outcome=success 로 끝나므로,
      # 판정은 반드시 **게시물이 실제로 늘었는지**로 한다. 이 비교를 없애지 마라.
      - name: 결과 요약
        if: always() && steps.guard.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ steps.before.outputs.count }}
          AI_OUTCOME: ${{ steps.ai.outcome }}
        run: |
          count_all() {
            {
              gh api "repos/$REPO/pulls/$PR/comments" --paginate --jq 'length'
              gh api "repos/$REPO/issues/$PR/comments" --paginate --jq 'length'
              gh api "repos/$REPO/pulls/$PR/reviews"   --paginate --jq 'length'
            } | awk '{s+=$1} END {print s+0}'
          }
          posted=$(( $(count_all) - ${BEFORE:-0} ))

          # 액션은 PR 이 워크플로 파일을 고치면 스스로 건너뛴다
          # ("workflow file must have identical content to the default branch").
          # PR 에서 워크플로를 고쳐 시크릿을 빼가는 걸 막는 장치이므로 우회하지 마라.
          # 원인을 모르면 배선 문제로 오진하게 되니 여기서 이름을 붙여준다.
          if gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' \
               | grep -q '^\.github/workflows/'; then
            wf_changed=yes
          else
            wf_changed=no
          fi

          if [ "$posted" -gt 0 ]; then
            {
              echo "### AI 보조 리뷰 완료"
              echo "게시물 **${posted}건**."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$wf_changed" = "yes" ]; then
            echo "::warning::워크플로 파일을 수정한 PR 이라 AI 리뷰가 건너뛰어졌습니다(정상 동작)."
            {
              echo "### AI 보조 리뷰 건너뜀 — 워크플로 파일 수정 PR"
              echo "이 PR 이 \`.github/workflows/\` 를 고치므로 액션이 스스로 실행을 거부했습니다."
              echo "PR 에서 워크플로를 고쳐 시크릿을 탈취하는 것을 막는 장치입니다 — **배선 문제가 아닙니다.**"
              echo "이 PR 이 머지되면 다음 PR 부터 리뷰가 정상 동작합니다."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::AI 리뷰가 한 건도 게시되지 않았습니다(결정론 검사는 정상)."
            {
              echo "### AI 보조 리뷰 미게시"
              echo "액션 결과: \`${AI_OUTCOME}\` · 게시물 증가: **0건**"
              echo "결정론 검사(ruff·pytest·gitleaks)는 그대로 동작합니다."
              echo ""
              echo "확인 순서: GitHub App 설치 → API 키 → 사용 한도 → 허용 도구 목록 → 최대 턴 수."
              echo "사용 한도 초과나 App 미설치는 **재실행해도 낫지 않는다** — 계정 쪽을 먼저 보라."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
