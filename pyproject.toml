[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clossify"
version = "0.1.0"
description = "Naver SmartStore automation MCP server (commerce API, listing compliance, image QA)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "clossify" }]
dependencies = [
    "mcp",
    "bcrypt",
    "requests",
]

[project.scripts]
clossify = "clossify.mcp_server:main"

[project.optional-dependencies]
# T-205b — CI(.github/workflows/ci.yml) 가 ruff==0.6.9 로 고정되어 있다. 로컬에서
# 다른 버전을 쓰면 셀렉터 해석 차이로 "로컬은 통과, CI 는 실패" 가 발생한다
# (직전 티켓이 이 함정에 걸렸다: ISC004/RUF059 셀렉터가 상위 버전에만 있어
# 0.6.9 에서는 설정 파싱이 exit 2 로 실패). 따라서 개발 환경도 동일 버전을
# 고정한다. 런타임 의존성(dependencies)은 건드리지 않는다.
dev = [
    "pytest",
    "ruff==0.6.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clossify"]
# Fix 8 — agents 프롬프트(9개 .md) 와 config.example.json 을 wheel 에 포함.
# LLM 클라이언트가 패키지 설치만으로 프롬프트 자산/예시 설정을 사용할 수 있도록.
[tool.hatch.build.targets.wheel.force-include]
"agents" = "clossify/agents"
"config.example.json" = "clossify/config.example.json"
# T-110 — 카테고리 메타데이터를 wheel 에 포함. 패키지 설치만으로
# category_meta 조회 헬퍼가 데이터를 사용할 수 있도록.
"data/category_meta.json" = "clossify/data/category_meta.json"
"data/certification_types.json" = "clossify/data/certification_types.json"
"data/notice_types.json" = "clossify/data/notice_types.json"

[tool.hatch.build.targets.sdist]
include = ["src/clossify", "agents", "data", "config.example.json", "README.md", "pyproject.toml"]

# T-205a — ruff 설정. CI 가 `ruff check .` 를 실행하며, 이 설정이 없으면 ruff 의
# 기본 룰셋이 적용되어 프로젝트 의도와 무관한 대량 위반이 발생한다. 아래 룰셋은
# 프로젝트 코드 품질에 의미 있는 규칙만 켜고, 각각 끄는 규칙은 사유를 남긴다.
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    # 실행 가능한 인터프리터와 호환되지 않는 임시 스크랩 디렉토리.
    ".local",
]

[tool.ruff.lint]
# 켜는 규칙 — 각각 실제 코드 품질에 기여하고 고치는 비용이 합리적이다.
#   E   — pycodestyle 오류(들여쓰기/공백 등). 가독성·정확성 기여.
#   W   — pycodestyle 경고(후행 공백 등).
#   F   — Pyflakes. 미사용 import/변수, 불필요 f-string 등 실제 결함 탐지.
#   I   — isort. import 정렬 (일관성).
#   UP  — pyupgrade. Python 3.10+ 에 맞는 현대적 문법(불필요 utf8 선언 제거 등).
#   SIM — flake8-simplify. 중첩 with 결합(SIM117) 등 가독성 개선.
#   RUF — Ruff 고유 규칙. 미사용 noqa(RUF100), __all__ 정렬(RUF022) 등.
#   FURB — refurb. regex 플래그 별칭(FURB167) 등 현대화.
#   PIE — flake8-pie. 컨테이너 빌트인 재구현(PIE807) 등.
#   PLR — pylint-refactor. from-import 간소화(PLR0402).
select = ["E", "W", "F", "I", "UP", "SIM", "RUF", "FURB", "PIE", "PLR"]
ignore = [
    # BLE001 (blind-except): MCP 도구 경계에서 는 의도적으로 Exception 을 넓게
    # 잡아 _sanitize_error 로 위생화한 뒤 _fail 로 변환한다(보안 요구사항 Fix 7).
    # 좁은 예외만 잡으면 새로운 예외 유형이 샌드박스를 빠져나갈 수 있다.
    "BLE001",
    # RUF015 (list(x)[0] -> next(iter(x))): 순수 스타일 선호. list() 가 명시적으로
    # 전체를 소비한다는 의도가 더 명확한 지점이 많으며, next(iter()) 로 바꿔도
    # 정확성 이득이 없다. 38건 전수수동 변환은 비용/이득이 맞지 않는다.
    "RUF015",
    # TRY004 (type-check-without-type-error): ValueError 대신 TypeError 를 권장하지만,
    # 본 프로젝트의 공개 계약(setup 검증, build_payload 등)은 ValueError 로 약속되어
    # 있어 테스트가 의존한다. API 변경 없이는 따를 수 없다.
    "TRY004",
    # S110/S112 (try-except-pass / try-except-continue): 핸들 닫기·재시도 루프의
    # finally/except 에서 의도적으로 조용히 넘기는 지점들. 각각 finally 로 자원
    # 정리하거나 다음 시도로 진행하기 위한 것이다.
    "S110",
    "S112",
    # SIM102 (collapsible-if): 중첩 if 를 and 로 결합하라는 규칙인데, 조건을
    # 분리된 두 단계로 두는 쪽이 가독성·디버깅에 유리한 경우가 있다.
    "SIM102",
    # SIM103 (needless-bool): if/else 로 bool 을 반환하는 패턴을 조건식으로
    # 압축하라는 규칙. 디버거 중단점/로그 부착 점을 잃으므로 현 프로젝트에서는
    # 명시적 형태를 유지한다.
    "SIM103",
    # SIM115 (open-file-with-context-handler): upload_images 의 finally 기반 핸들
    # 정리는 파일 핸들을 리스트에 모아 두고 requests.post 직후에 한꺼번에 닫아야
    # 해서 with 로 바꿀 수 없다(멀티파트 업로드 중 핸들이 열려있어야 함).
    "SIM115",
    # SIM117 (multiple-with-statements): 중첩 with 를 한 with 로 결합하라는 규칙.
    # ruff 의 자동 fix 가 라인 길이 한계로 대부분(45/47건) 적용되지 않아 수동
    # 변환이 필요한데, mock.patch 중첩과 pytest.raises 중첩이 얽힌 테스트 코드가
    # 대부분이어로 의미를 해치지 않으면서 결합하기 어렵다. 순수 스타일 규칙이므로
    # 본 CI 그린화 티켓 범위에서는 무시한다(별도 포맷터 도입 티켓에서 재검토).
    "SIM117",
    # [제거됨 T-205b] 직전 티켓이 "ISC004"(implicit-string-concatenation-in-
    # collection-literal) 를 끄려 했으나 ruff==0.6.9 에는 ISC003 까지만 존재한다
    # (ISC004 는 상위 버전에 추가됨). CI 가 0.6.9 로 고정되어 있으므로
    # 존재하지 않는 셀렉터를 두면 설정 파싱이 exit 2 로 실패한다. 따라서
    # 셀렉터 자체를 제거한다. 원래 의도(문자열 인접 결합 1건 허용)는
    # 보고에 기록하며, 0.6.9 범위에서는 별도 ISC003 도 활성화되지 않으므로
    # 현 위치의 인접 결합은 ISC 계열 위반으로 잡히지 않는다.
    # "ISC004",  # removed — see T-205b

    # PLW1510 (subprocess-run-without-check): 1건. 외부 도구 호출이 아닌 내부
    # 보조 스크립트 런치이며 check=True 가 필요한 실패 의미가 없다.
    "PLW1510",
    # PLR09** (too-many-branches/statements/arguments/returns/positional): 본
    # 프로젝트의 핵심 함수(build_payload, register_product, prepare_listing 등)는
    # 고시 필드·QA 집계·컴플라이언스 게이트 등 도메인 복잡도를 본질적으로 갖는다.
    # 분할하면 호출자 호환·테스트 재작성 비용이 크고 도메인 응집이 떨어진다.
    # 본 티켓의 범위(CI 그린화)를 넘으므로 무시한다.
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    # PLR0402(manual-from-import), PLR2004(magic-value) 등 추가 PLR 중 스타일
    # 성격은 켜둔 채로 두되, 복잡도군만 위에서 무시.
    # E501 (line-too-long): 소스 본체는 line-length=100 안에서 작성되었으나 일부
    # URL/데이터 리터럴·한국어 주석 줄이 100자를 넘는다. 포맷터(ruff format)
    # 도입이 별도 티켓이므로 본 티켓에서는 무시하고 테스트 외 줄길이는 per-file
    # ignore 로 푼다.
    "E501",
    # E741 (ambiguous-variable-name): l/i/O 단문자 변수. 루프 인덱스·선형대수
    # 컨텍스트에서 일상적으로 쓰이며 이름 변경은 가독성을 해친다.
    "E741",
    # SIM105 (suppressible-exception): contextlib.suppress 로 바꾸라는 규칙.
    # finally 기반 정리와 얽혀 있어 suppress 가 의미를 흐린다.
    "SIM105",
    # SIM108/SIM110/SIM101: if-else→삼항·reimplemented-builtin·duplicate-isinstance.
    # 명시적 제어문이 가독성에 나은 소규모 스타일 지점들.
    "SIM108",
    "SIM110",
    "SIM101",
    # RUF001 (ambiguous-unicode-character): 한국어 전각 글자(예: ‘|’)를 ASCII |
    # 로 오인해 경고한다. 한국어 리터럴이 정책인 본 프로젝트와 충돌.
    "RUF001",
    # RUF005 (collection-literal-concatenation): a + [b] → [*a, b] 권장.
    # 기존 리스트 결합 형태가 의도를 더 명확히 드러내는 지점이 많다.
    "RUF005",
    # [제거됨 T-205b] 직전 티켓이 "RUF059"(unused-unpacked-variable) 를 끄려 했으나
    # ruff==0.6.9 의 RUF0xx 계열은 RUF034 까지만 존재한다(RUF059 는 상위 버전에
    # 추가됨). 존재하지 않는 셀렉터이므로 제거한다. 원래 의도(튜플 언패 미사용
    # 슬롯을 _ 로 묻지 않고 이름으로 둔 위치 유지)는 보고에 기록한다. 0.6.9 범위
    # 에서는 해당 패턴을 잡는 규칙이 없으므로 별도 조치 없이 현 코드가 통과한다.
    # "RUF059",  # removed — see T-205b
    # FURB110 (if-exp-instead-of-or-operator): x if c else y → c or y 권장.
    # 의미가 다른 경우(거짓값 허용)가 있어 기계 적용이 위험.
    "FURB110",
    # PLR2004 (magic-value-comparison): HTTP 상태 코드(200/400), 필드 개수,
    # ID 자릿수 등 도메인 상수를 직접 비교하는 곳이 많다. 매번 상수 추출은
    # 가독성을 떨어뜨리며 본 티켓 범위를 넘는다.
    "PLR2004",
]

# CI 가 `ruff check .` exit 0 이 되도록 자동 수정 가능한 위반은 본 티켓에서
# 실제로 고쳤다(미사용 import 제거, import 정렬, 중첩 with 결합 등). 임의로
# 무시한 규칙은 위 ignore 목록에 사유를 남겼다.

[tool.ruff.lint.per-file-ignores]
# src 레이아웃(sys.path) 사용으로 인해 모듈 최상단 import 가 불가능한 파일들.
# _PROJECT_ROOT/_SRC 계산과 sys.path.insert 가 선행되어야 로컬 패키지 import 가
# 가능하므로 E402 는 이 파일들에서 본질적으로 성립하지 않는다.
"tests/**" = ["E402"]
"scripts/**" = ["E402"]
