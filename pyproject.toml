[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clossify"
version = "0.1.0"
description = "Naver SmartStore automation MCP server (commerce API, listing compliance, image QA)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "clossify" }]
dependencies = [
    "mcp",
    "bcrypt",
    "requests",
]

[project.scripts]
clossify = "clossify.mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clossify"]
# Fix 8 — agents 프롬프트(9개 .md) 와 config.example.json 을 wheel 에 포함.
# LLM 클라이언트가 패키지 설치만으로 프롬프트 자산/예시 설정을 사용할 수 있도록.
[tool.hatch.build.targets.wheel.force-include]
"agents" = "clossify/agents"
"config.example.json" = "clossify/config.example.json"
# T-110 — 카테고리 메타데이터를 wheel 에 포함. 패키지 설치만으로
# category_meta 조회 헬퍼가 데이터를 사용할 수 있도록.
"data/category_meta.json" = "clossify/data/category_meta.json"
"data/certification_types.json" = "clossify/data/certification_types.json"
"data/notice_types.json" = "clossify/data/notice_types.json"

[tool.hatch.build.targets.sdist]
include = ["src/clossify", "agents", "data", "config.example.json", "README.md", "pyproject.toml"]
